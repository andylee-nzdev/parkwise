name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest,
      # so the PostGIS integration tests need no service container.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: backend/target/surefire-reports/TEST-*.xml
          check_name: Test results

      - name: Upload jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: parkwise-jar
          path: backend/target/*.jar
          retention-days: 7
          if-no-files-found: error
