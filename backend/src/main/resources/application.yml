spring:
  application:
    name: parkwise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parking}
    username: ${DB_USER:parking}
    password: ${DB_PASSWORD:parking}
  flyway:
    enabled: true
    locations: classpath:db/migration

# Auckland Transport ParkingService (ArcGIS FeatureServer) — public, no key required.
at:
  parking:
    base-url: https://services2.arcgis.com/JkPEgZJGxhSjYOo0/arcgis/rest/services/ParkingService/FeatureServer
    car-park-layer: 1
    park-and-ride-layer: 5
    # ingestion cadence; occupancy snapshots would run more frequently in Phase 3
    ingest-cron: "0 0 3 * * *"   # daily 03:00

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    nz.parkwise: INFO
